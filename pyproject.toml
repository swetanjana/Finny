[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finny"
version = "0.1.0"
description = "Financial-Data Agent over Apple SEC Filings with RBAC and Feedback Loop"
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.9.0",
    "sentence-transformers>=3.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "pdfplumber>=0.11.0",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "yfinance>=0.2.40",
    "langchain>=1.3.14",
    "langgraph>=1.2.10",
    "langchain-groq>=1.1.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
finny = "finny.interface.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
